<!-- =====================================================================
     FILE: components/student-card/student-card.html
     WHAT: Portrait, name, faculty, class year, quote and story link.
     WHY: One accessible link makes the whole card clickable and tabbable.
     ===================================================================== -->
<a
  class="card"
  [routerLink]="['/students', student().id]"
  [attr.aria-label]="'Read the story of ' + student().name"
>
  <!-- Lazy-load portraits and replace a failed image with the local fallback. -->
  <img
    class="card__photo"
    [src]="photoSrc()"
    [alt]="'Portrait of ' + student().name"
    loading="lazy"
    (error)="onImageError()"
  />

  <div class="card__body">
    <div class="card__heading">
      <h3 class="card__name">{{ student().name }}</h3>
      <!-- currentColor takes the red from CSS; the arrow is decorative. -->
      <svg
        class="card__arrow"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.6"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
      >
        <path d="M7 17 17 7M8 7h9v9" />
      </svg>
    </div>
    <p class="card__meta">{{ student().faculty }} · Class of {{ student().classYear }}</p>
    <p class="card__quote">“{{ student().quote }}”</p>
  </div>
</a>
